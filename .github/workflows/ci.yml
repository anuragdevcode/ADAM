name: ADAM CI / Regression & Acceptance Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    name: Backend Regression & Acceptance Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: adam_ci
          POSTGRES_USER: adam
          POSTGRES_PASSWORD: adam_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Tesseract OCR & Hindi models)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin libmagic1

      - name: Install Python Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest httpx

      - name: Apply Alembic Schema Migrations on Empty PostgreSQL (R3)
        run: |
          adam db upgrade
        env:
          DATABASE_URL: postgresql+psycopg://adam:adam_ci_password@localhost:5432/adam_ci

      - name: Verify Migration Rollback & Re-upgrade on PostgreSQL (R3)
        run: |
          adam db downgrade -r base
          adam db upgrade -r head
        env:
          DATABASE_URL: postgresql+psycopg://adam:adam_ci_password@localhost:5432/adam_ci

      - name: Verify CLI Doctor & Bootstrap
        run: |
          adam dev doctor
          adam dev bootstrap

      - name: Run Disaster Recovery Restore Drill (R6)
        run: |
          adam backup drill

      - name: Run Primary Acceptance Tests (Phase 09)
        run: |
          pytest tests/test_integration_acceptance.py -v

      - name: Run Security & Contract Test Suites
        run: |
          pytest tests/test_security_acceptance.py tests/test_contract_openapi.py tests/test_evaluation_metrics.py -v

      - name: Run Full Regression Test Suite
        run: |
          pytest -v

  frontend-build:
    name: Next.js Frontend Verification & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: Build Next.js Production Bundle
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
