[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adam"
version = "0.1.0"
description = "Uttarakhand Public Records Acquisition, Governance and Processing System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "bcrypt>=4.0,<6",
    "click>=8.0,<9",
    "cryptography>=42.0,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.20,<3",
    "Pillow>=10,<12",
    "pydantic>=2.0,<3",
    "PyMuPDF>=1.24,<2",
    "pgvector>=0.3.0,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
include = ["adam*"]

[project.scripts]
adam = "adam.cli:cli"
adam-api = "adam.api.app:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
