[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adam"
version = "0.1.0"
description = "Uttarakhand Public Records Acquisition, Governance and Processing System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "bcrypt>=4.0,<6",
    "boto3>=1.34,<2",
    "click>=8.0,<9",
    "cryptography>=42.0,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.20,<3",
    "Pillow>=10,<12",
    "pydantic>=2.0,<3",
    "PyMuPDF>=1.24,<2",
    "pgvector>=0.3.0,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.7,<4",
]
otel = [
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
]

[tool.setuptools.packages.find]
include = ["adam*"]

[project.scripts]
adam = "adam.cli:cli"
adam-api = "adam.api.app:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["alembic", "build", "dist", ".git", "__pycache__", "ui", "node_modules"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
pretty = true

[tool.coverage.run]
source = ["adam"]
omit = ["tests/*", "build/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
