services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in production}
    ports: !override []

  api:
    build:
      context: .
      target: production
    command: adam serve --host 0.0.0.0 --port 8000
    environment:
      ADAM_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/${POSTGRES_DB:-adam}
      SIGNING_SECRET: ${SIGNING_SECRET:?SIGNING_SECRET must be set in production}
      ADAM_ALLOW_HOSTED_VOICE: ${ADAM_ALLOW_HOSTED_VOICE:-false}
    volumes: !override
      - adam_storage:/app/.adam_storage

  worker:
    build:
      context: .
      target: production
    command: adam worker run
    environment:
      ADAM_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@postgres:5432/${POSTGRES_DB:-adam}
      SIGNING_SECRET: ${SIGNING_SECRET:?SIGNING_SECRET must be set in production}
    volumes: !override
      - adam_storage:/app/.adam_storage

  ui:
    build:
      context: ./ui
      target: production
    environment:
      NEXT_API_ORIGIN: http://api:8000
    volumes: !override []
